name: kp-ip-test
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch KP search page and analyze
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -s -A "$UA" -H "accept: text/html" -H "accept-language: sr-RS,sr;q=0.9" \
            "https://www.kupujemprodajem.com/pretraga?categoryId=23&order=renewDateDesc" -o page.html \
            -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          echo "runner IP: $(curl -s https://api.ipify.org)"
          python3 - <<'EOF'
          import re, json
          h = open('page.html', encoding='utf-8').read()
          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S)
          if not m:
              print('NEMA __NEXT_DATA__ (blokada/captcha)')
              raise SystemExit(0)
          d = json.loads(m.group(1))
          st = d['props']['initialReduxState']
          s = st.get('search', {})
          cats = st.get('category', {}).get('categories', {})
          print(f"total={s.get('total')} ads={len(s.get('adsIds', []))} categories={len(cats)}")
          print('VERDIKT:', 'PUN ODGOVOR - radi!' if s.get('adsIds') else 'DEGRADIRAN (prazno)')
          EOF
