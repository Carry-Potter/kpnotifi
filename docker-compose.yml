services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kpnotifi
      POSTGRES_PASSWORD: kpnotifi
      POSTGRES_DB: kpnotifi
    ports:
      - "5433:5432"
    volumes:
      - kpnotifi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpnotifi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kpnotifi_pgdata:
